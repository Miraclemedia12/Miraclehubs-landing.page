<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Vireon Ads - Admin Dashboard</title>
    <!-- Google Fonts & Font Awesome Icons -->
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Plus Jakarta Sans', sans-serif;
        }

        body {
            background-color: #0f172a;
            color: #f8fafc;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
        }

        .dashboard-card {
            background: #1e293b;
            border: 1px solid #334155;
            border-radius: 24px;
            width: 100%;
            max-width: 480px;
            padding: 32px;
            box-shadow: 0 20px 40px rgba(0, 0, 0, 0.4);
            position: relative;
        }

        .header {
            display: flex;
            align-items: center;
            justify-content: space-between;
            margin-bottom: 24px;
            padding-bottom: 16px;
            border-bottom: 1px solid #334155;
        }

        .brand {
            display: flex;
            align-items: center;
            gap: 12px;
        }

        .brand-icon {
            background: linear-gradient(135deg, #2ecc71, #27ae60);
            width: 42px;
            height: 42px;
            border-radius: 12px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 20px;
            color: white;
            box-shadow: 0 4px 12px rgba(46, 204, 113, 0.3);
        }

        .brand h2 {
            font-size: 20px;
            font-weight: 700;
            color: #ffffff;
        }

        .brand p {
            font-size: 12px;
            color: #94a3b8;
        }

        .status-badge {
            background: rgba(34, 197, 94, 0.1);
            color: #4ade80;
            border: 1px solid rgba(34, 197, 94, 0.3);
            font-size: 12px;
            padding: 6px 12px;
            border-radius: 20px;
            font-weight: 600;
            display: flex;
            align-items: center;
            gap: 6px;
        }

        .status-dot {
            width: 8px;
            height: 8px;
            background-color: #22c55e;
            border-radius: 50%;
            box-shadow: 0 0 8px #22c55e;
            animation: pulse 2s infinite;
        }

        @keyframes pulse {
            0% { opacity: 1; }
            50% { opacity: 0.4; }
            100% { opacity: 1; }
        }

        .live-link-box {
            background: #0f172a;
            border: 1px dashed #475569;
            border-radius: 16px;
            padding: 16px;
            margin-bottom: 24px;
        }

        .live-link-box label {
            font-size: 12px;
            text-transform: uppercase;
            letter-spacing: 0.5px;
            color: #64748b;
            font-weight: 700;
            display: block;
            margin-bottom: 6px;
        }

        .live-link-val {
            color: #38bdf8;
            font-size: 14px;
            font-weight: 600;
            word-break: break-all;
        }

        .input-group {
            margin-bottom: 24px;
        }

        .input-group label {
            display: block;
            font-size: 14px;
            font-weight: 600;
            color: #cbd5e1;
            margin-bottom: 8px;
        }

        .input-wrapper {
            position: relative;
        }

        .input-wrapper i {
            position: absolute;
            left: 16px;
            top: 50%;
            transform: translateY(-50%);
            color: #64748b;
            font-size: 16px;
        }

        .input-field {
            width: 100%;
            background: #0f172a;
            border: 1px solid #334155;
            border-radius: 14px;
            padding: 14px 16px 14px 46px;
            color: #ffffff;
            font-size: 14px;
            outline: none;
            transition: all 0.2s ease;
        }

        .input-field:focus {
            border-color: #2ecc71;
            box-shadow: 0 0 0 3px rgba(46, 204, 113, 0.2);
        }

        .btn-update {
            width: 100%;
            background: linear-gradient(135deg, #2ecc71, #27ae60);
            color: white;
            border: none;
            border-radius: 14px;
            padding: 16px;
            font-size: 16px;
            font-weight: 700;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 10px;
            box-shadow: 0 8px 20px rgba(46, 204, 113, 0.3);
            transition: transform 0.2s ease, box-shadow 0.2s ease;
        }

        .btn-update:hover {
            transform: translateY(-2px);
            box-shadow: 0 12px 24px rgba(46, 204, 113, 0.4);
        }

        .btn-update:active {
            transform: scale(0.98);
        }

        /* --- PROFESSIONAL POPUP MODAL --- */
        .modal-overlay {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(15, 23, 42, 0.8);
            backdrop-filter: blur(8px);
            display: flex;
            justify-content: center;
            align-items: center;
            opacity: 0;
            visibility: hidden;
            transition: all 0.3s ease;
            z-index: 1000;
            padding: 20px;
        }

        .modal-overlay.active {
            opacity: 1;
            visibility: visible;
        }

        .modal-content {
            background: #1e293b;
            border: 1px solid #334155;
            border-radius: 20px;
            padding: 28px;
            width: 100%;
            max-width: 380px;
            text-align: center;
            transform: scale(0.8);
            transition: transform 0.3s ease;
            box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.5);
        }

        .modal-overlay.active .modal-content {
            transform: scale(1);
        }

        .modal-icon {
            width: 60px;
            height: 60px;
            background: rgba(34, 197, 94, 0.15);
            color: #22c55e;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 28px;
            margin: 0 auto 16px;
            border: 2px solid rgba(34, 197, 94, 0.3);
        }

        .modal-content h3 {
            font-size: 20px;
            font-weight: 700;
            color: #ffffff;
            margin-bottom: 8px;
        }

        .modal-content p {
            font-size: 14px;
            color: #94a3b8;
            margin-bottom: 24px;
            line-height: 1.5;
        }

        .btn-close {
            background: #334155;
            color: white;
            border: none;
            border-radius: 12px;
            padding: 12px 24px;
            font-weight: 600;
            font-size: 14px;
            cursor: pointer;
            width: 100%;
            transition: background 0.2s ease;
        }

        .btn-close:hover {
            background: #475569;
        }
    </style>
</head>
<body>

    <div class="dashboard-card">
        <div class="header">
            <div class="brand">
                <div class="brand-icon">
                    <i class="fa-solid fa-link"></i>
                </div>
                <div>
                    <h2>Link Control</h2>
                    <p>Page 1 Target Manager</p>
                </div>
            </div>
            <div class="status-badge">
                <div class="status-dot"></div> Live DB
            </div>
        </div>

        <div class="live-link-box">
            <label><i class="fa-solid fa-bolt"></i> Currently Active Link</label>
            <div class="live-link-val" id="current-url">Fetching from Firebase...</div>
        </div>

        <div class="input-group">
            <label for="new-url-input">Update Destination Link</label>
            <div class="input-wrapper">
                <i class="fa-solid fa-globe"></i>
                <input type="url" id="new-url-input" class="input-field" placeholder="https://chat.whatsapp.com/..." required>
            </div>
        </div>

        <button class="btn-update" onclick="updateDatabaseLink()">
            <i class="fa-solid fa-floppy-disk"></i> Save & Push Live
        </button>
    </div>

    <!-- POPUP SUCCESS MODAL -->
    <div class="modal-overlay" id="successModal">
        <div class="modal-content">
            <div class="modal-icon">
                <i class="fa-solid fa-circle-check"></i>
            </div>
            <h3>Updated Successfully!</h3>
            <p>Your landing page target URL (`links/page1`) has been updated in real-time.</p>
            <button class="btn-close" onclick="closeModal()">Done</button>
        </div>
    </div>

    <!-- Firebase SDK v9 (Compat Mode) -->
    <script src="https://www.gstatic.com/firebasejs/9.22.1/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.22.1/firebase-database-compat.js"></script>

    <script>
        // YOUR FIREBASE CONFIGURATION
        const firebaseConfig = {
            apiKey: "AIzaSyA7n2ue0wvZxarsQsZqgOlbhPrC5_KpAgE",
            authDomain: "landing-page-99a45.firebaseapp.com",
            databaseURL: "https://landing-page-99a45-default-rtdb.firebaseio.com",
            projectId: "landing-page-99a45",
            storageBucket: "landing-page-99a45.firebasestorage.app",
            messagingSenderId: "893541422521",
            appId: "1:893541422521:web:723558c3713f1b53355268",
            measurementId: "G-7PWGQ7V6QF"
        };

        // INITIALIZE FIREBASE
        firebase.initializeApp(firebaseConfig);
        const db = firebase.database();
        const linkRef = db.ref('links/page1');

        const currentUrlDisplay = document.getElementById('current-url');
        const newUrlInput = document.getElementById('new-url-input');
        const modal = document.getElementById('successModal');

        // REALTIME LISTENER FOR PAGE1 LINK
        linkRef.on('value', (snapshot) => {
            const url = snapshot.val();
            if (url) {
                currentUrlDisplay.textContent = url;
                newUrlInput.value = url;
            } else {
                currentUrlDisplay.textContent = "No active link set in Realtime DB yet.";
            }
        }, (error) => {
            currentUrlDisplay.textContent = "Error loading database: " + error.message;
        });

        // UPDATE DATABASE FUNCTION
        function updateDatabaseLink() {
            const freshUrl = newUrlInput.value.trim();

            if (!freshUrl) {
                alert("Please paste a valid URL before updating.");
                return;
            }

            // PUSH TO REALTIME DB AT 'links/page1'
            linkRef.set(freshUrl)
                .then(() => {
                    openModal();
                })
                .catch((error) => {
                    alert("Error updating link: " + error.message);
                });
        }

        // MODAL FUNCTIONS
        function openModal() {
            modal.classList.add('active');
        }

        function closeModal() {
            modal.classList.remove('active');
        }

        // CLOSE MODAL IF USER CLICKS OUTSIDE CARD
        window.onclick = function(event) {
            if (event.target == modal) {
                closeModal();
            }
        }
    </script>
</body>
</html>
